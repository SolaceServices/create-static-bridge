info:
  name: 6 - Enable Bridge
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{consumer-url}}/config/msgVpns/{{consumer-vpn}}/bridges/{{bridge-name}},auto"
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth:
    type: basic
    username: "{{consumer-admin}}"
    password: "{{consumer-admin-password}}"

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
